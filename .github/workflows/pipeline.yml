# Generated by cicd-harness. Extend Hephaestus instead of adding local steps.
name: Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: heliannuuthus/hephaestus/.github/workflows/ci-golang-service.yml@main
    permissions:
      contents: read
    with:
      workdir: './'
      GOOS: 'linux'
      GOARCH: 'amd64'
      ENTRANCE: './'

  containerize:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-containerize.yml@main
    permissions:
      contents: read
      packages: write
    with:
      workdir: './'
      version: '${{ needs.ci.outputs.version }}'
      targets: 'build/'
      release-tags: true

  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, containerize]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-promote-gitops.yml@main
    permissions:
      contents: read
    with:
      version: '${{ needs.ci.outputs.version }}'
      updates: 'apps/chaos/release.yaml=ghcr.io/heliantheons/chaos'
      gitops_app_id: '4727462'
    secrets:
      gitops_app_private_key: '${{ secrets.GITOPS_APP_PRIVATE_KEY }}'
